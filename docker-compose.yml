version: '3.9'

services:
  db:
    image: postgres:15-alpine
    container_name: safetrack_db
    environment:
      POSTGRES_DB: safetrack
      POSTGRES_USER: safetrack_user
      POSTGRES_PASSWORD: safetrack_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/config/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safetrack_user -d safetrack"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: safetrack_backend
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/uploads:/app/uploads
    command: npm run dev

volumes:
  pgdata:
