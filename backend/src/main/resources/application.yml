server:
  port: ${PORT:4000}

spring:
  application:
    name: safetrack-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/safetrack}
    username: ${SPRING_DATASOURCE_USERNAME:safetrack_user}
    password: ${SPRING_DATASOURCE_PASSWORD:safetrack_pass}
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:465}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          socketFactory:
            port: 465
            class: javax.net.ssl.SSLSocketFactory
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  jwt-secret: ${JWT_SECRET:change-me-to-a-long-random-secret}
  upload-dir: ${UPLOAD_DIR:uploads}
  groq-api-key: ${GROQ_API_KEY:}
  gemini-api-key: ${GEMINI_API_KEY:}
  paystack-secret-key: ${PAYSTACK_SECRET_KEY:}

